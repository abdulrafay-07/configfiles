# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ─────────────────────────────────────────────
# General
# ─────────────────────────────────────────────

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Put status bar at the top
set -g status-position top

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# | = vertical split
bind | split-window -h

# - = horizontal split
bind - split-window -v


# ─────────────────────────────────────────────
# Pane resizing
# ─────────────────────────────────────────────

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# New window
bind c new-window

# Navigate windows
bind n next-window
bind p previous-window


# ─────────────────────────────────────────────
# Status bar
# ─────────────────────────────────────────────

set -g status-left ""
set -g status-left-length 0
set -g status-right-length 40

# Windows
setw -g window-status-format "#[fg=#a6adc8]#I: #W"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#f9e2af,bold]#I: #W"

# Right side
set -g status-right "#[fg=#a6adc8,bg=#313244] %Y-%m-%d  %H:%M #[fg=#313244,bg=#1e1e2e] "

# Status bar background
set -g status-style "bg=#313244"

# Pane border
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af"


# ─────────────────────────────────────────────
# Refresh
# ─────────────────────────────────────────────

set -g status-interval 1


# Allow Claude notifications to reach your outer terminal
set -g allow-passthrough on

# Force tmux to understand and forward extended key sequences (Shift+Enter)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g focus-events on
